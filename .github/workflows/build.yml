name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            aidl libstdc++6 build-essential ccache libsqlite3-dev libbz2-dev \
            liblzma-dev libjpeg-dev libpng-dev gettext

      - name: Install Buildozer & Latest Python-for-Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "Cython<3.0" virtualenv
          # نصب مستقیم آخرین نسخه بیلدوزر و p4a از گیت‌هاب با لینک‌های دانلود سالم
          python -m pip install --upgrade "git+https://github.com/kivy/buildozer.git"
          python -m pip install --upgrade "git+https://github.com/kivy/python-for-android.git"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cornix-Winner-PRO-APK
          path: bin/*.apk
