name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            aidl libstdc++6 build-essential ccache libsqlite3-dev libbz2-dev \
            liblzma-dev libjpeg-dev libpng-dev gettext curl

      - name: Install Buildozer & Clone Patched P4A
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "Cython<3.0" virtualenv
          python -m pip install --upgrade "git+https://github.com/kivy/buildozer.git"
          
          git clone https://github.com/kivy/python-for-android.git p4a_source
          sed -i 's|download.savannah.gnu.org|download-mirror.savannah.gnu.org|g' p4a_source/pythonforandroid/recipes/freetype/__init__.py || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug > buildozer_full.log 2>&1 || true

      - name: Extract and Show Real Error
        run: |
          python3 -c '
          import os, sys
          if not os.path.exists("buildozer_full.log"):
              sys.exit(0)
          with open("buildozer_full.log", "r", errors="ignore") as f:
              lines = f.readlines()
          
          clean_lines = []
          for line in lines:
              if "# ENVIRONMENT:" in line:
                  break
              clean_lines.append(line)
          
          error_sample = clean_lines[-80:] if len(clean_lines) >= 80 else clean_lines
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write("### 🔴 متن خطای اصلی کامپایلر:\n```text\n")
                  s.writelines(error_sample)
                  s.write("\n```\n")
          '
          # اگر فایل apk در bin نباشد، ارور بدهد
          if [ ! -f bin/*.apk ]; then
            echo "Build failed - no APK found"
            exit 1
          fi

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Log
          path: buildozer_full.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cornix-Winner-PRO-APK
          path: bin/*.apk
