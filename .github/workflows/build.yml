name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            aidl libstdc++6 build-essential ccache libsqlite3-dev libbz2-dev \
            liblzma-dev libjpeg-dev libpng-dev gettext curl

      - name: Install Buildozer & Clone Patched P4A
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "Cython<3.0" virtualenv
          python -m pip install --upgrade "git+https://github.com/kivy/buildozer.git"
          
          # کلون سورس p4a و اصلاح آدرس‌های احتمالی منقضی‌شده
          git clone https://github.com/kivy/python-for-android.git p4a_source
          sed -i 's|download.savannah.gnu.org|download-mirror.savannah.gnu.org|g' p4a_source/pythonforandroid/recipes/freetype/__init__.py || true

      - name: Build APK with Buildozer
        run: |
          # ذخیره کامل خروجی در فایل متنی
          buildozer -v android debug > buildozer_full.log 2>&1 || {
            echo "### ❌ خطای بیلدوزر (Buildozer Error):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 buildozer_full.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Log
          path: buildozer_full.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cornix-Winner-PRO-APK
          path: bin/*.apk
